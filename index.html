<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyMap — Accessible Navigator</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
  onerror="this.href='https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.css'" />
<style>
  :root{
    --bg:#0f1512;
    --panel:#16201c;
    --panel-border:#2a3a33;
    --accent:#4fd48a;
    --accent-dim:#2f6b4d;
    --text:#eef4f0;
    --text-dim:#9fb3a9;
    --danger:#e0665a;
    --focus:#ffd166;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{
    padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--panel-border);
    display:flex;align-items:center;gap:10px;
  }
  header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px;}
  header .status{margin-left:auto;font-size:13px;color:var(--text-dim);}

  #map{flex:1;min-height:0;}

  #searchBar{
    display:flex;gap:8px;padding:10px 12px;background:var(--panel);
    border-bottom:1px solid var(--panel-border);
  }
  #searchBar input{
    flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--panel-border);
    background:#0d1512;color:var(--text);font-size:16px;
  }
  #searchBar input:focus, button:focus{outline:3px solid var(--focus);outline-offset:2px;}
  #searchBar button, .catBtn{
    padding:12px 14px;border-radius:10px;border:1px solid var(--accent-dim);
    background:var(--accent-dim);color:var(--text);font-size:15px;font-weight:600;
    cursor:pointer;
  }
  #searchBar button:active, .catBtn:active{background:var(--accent);}

  #categories{
    display:flex;gap:8px;padding:0 12px 10px;background:var(--panel);
    overflow-x:auto;border-bottom:1px solid var(--panel-border);
  }
  .catBtn{white-space:nowrap;background:#0d1512;border-color:var(--panel-border);}
  .catBtn[aria-pressed="true"]{background:var(--accent-dim);border-color:var(--accent);}

  #bottomBar{
    display:flex;gap:8px;padding:10px 12px;background:var(--panel);
    border-top:1px solid var(--panel-border);
  }
  #bottomBar button{
    flex:1;padding:14px 10px;border-radius:10px;border:1px solid var(--panel-border);
    background:#0d1512;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;
  }
  #bottomBar button.primary{background:var(--accent-dim);border-color:var(--accent);}
  #bottomBar button:active{filter:brightness(1.2);}

  #liveRegion{position:absolute;left:-9999px;}

  #resultsList{
    list-style:none;margin:0;padding:0;max-height:0;overflow:hidden;
    background:var(--panel);transition:max-height .2s ease;
  }
  #resultsList.open{max-height:40vh;overflow-y:auto;}
  #resultsList li{
    padding:12px 16px;border-bottom:1px solid var(--panel-border);
  }
  #resultsList li button{
    width:100%;text-align:left;background:none;border:none;color:var(--text);
    font-size:15px;cursor:pointer;padding:4px 0;
  }
  #resultsList li .dist{color:var(--text-dim);font-size:13px;display:block;margin-top:2px;}
  #resultsList li:first-child .dist{color:var(--accent);font-weight:600;}

  .me-dot{width:18px;height:18px;border-radius:50%;background:#4fd48a;
    border:3px solid #0f1512;box-shadow:0 0 0 3px #4fd48a55;}
  .maplibregl-popup-content{background:#16201c;color:#eef4f0;border:1px solid #2a3a33;}
  .maplibregl-popup-tip{border-top-color:#16201c !important;border-bottom-color:#16201c !important;}
  .maplibregl-ctrl-attrib{font-size:10px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>MyMap</h1>
    <span class="status" id="statusText">Locating…</span>
  </header>

  <div id="searchBar">
    <input id="searchInput" type="text" placeholder="Search a place or address"
      aria-label="Search a place or address" />
    <button id="searchBtn" aria-label="Search">Search</button>
  </div>

  <div id="categories" role="group" aria-label="Nearby categories">
    <button class="catBtn" data-tag="amenity=restaurant" aria-pressed="false">Food</button>
    <button class="catBtn" data-tag="amenity=pharmacy" aria-pressed="false">Pharmacy</button>
    <button class="catBtn" data-tag="amenity=atm" aria-pressed="false">ATM</button>
    <button class="catBtn" data-tag="amenity=hospital" aria-pressed="false">Hospital</button>
    <button class="catBtn" data-tag="highway=bus_stop" aria-pressed="false">Bus stop</button>
    <button class="catBtn" data-tag="shop=supermarket" aria-pressed="false">Supermarket</button>
  </div>

  <ul id="resultsList" aria-live="off"></ul>

  <div id="map" role="application" aria-label="Map view"></div>

  <div id="bottomBar">
    <button id="myLocBtn" class="primary" aria-label="Announce and center my current location">📍 My Location</button>
    <button id="repeatBtn" aria-label="Repeat last announcement">🔊 Repeat</button>
    <button id="stopBtn" aria-label="Stop speaking">⏹ Stop</button>
  </div>

  <div id="liveRegion" aria-live="polite"></div>
  <div id="errorBanner" role="alert" style="display:none;position:absolute;left:8px;right:8px;top:56px;
    background:#3a1616;border:1px solid #e0665a;color:#ffd6d0;padding:10px 12px;border-radius:8px;
    font-size:13px;z-index:5;"></div>
</div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"
  onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.js';s.onload=function(){window.__mlReady&&window.__mlReady();};document.body.appendChild(s);"></script>
<script>
(function(){
  "use strict";

  // ---------- Dark theme + blue roads: rewrite the free OpenFreeMap "liberty" style ----------
  var DARK_BG = '#0f1512';
  var WATER_COLOR = '#12283a';
  var WATERWAY_COLOR = '#2e5b86';
  var GREEN_FILL = '#16261c';
  var GREEN_FILL_2 = '#182420';
  var BUILDING_FILL = '#1c2622';
  var ROAD_MAIN = '#4aa3ff';
  var ROAD_CASING = '#1c4d80';
  var RAIL_COLOR = '#4a5a62';
  var BOUNDARY_COLOR = '#3a4a42';
  var LABEL_TEXT = '#eef4f0';
  var LABEL_HALO = '#0f1512';
  var ROAD_LABEL_TEXT = '#bfe0ff';

  function darkenStyle(style){
    style.layers.forEach(function(layer){
      try{
        applyDarkPaint(layer);
      }catch(e){
        // Skip this one layer rather than corrupting the whole style
      }
    });
    return style;
  }

  function applyDarkPaint(layer){
      var p = layer.paint || (layer.paint = {});
      var sl = layer['source-layer'];

      if(layer.type === 'background'){ p['background-color'] = DARK_BG; return; }
      if(layer.id === 'natural_earth'){ p['raster-opacity'] = 0; return; }

      if(sl === 'water' && layer.type === 'fill'){ p['fill-color'] = WATER_COLOR; return; }
      if(sl === 'waterway' && layer.type === 'line'){ p['line-color'] = WATERWAY_COLOR; return; }
      if(sl === 'water_name' || (sl === 'waterway' && layer.type === 'symbol')){
        p['text-color'] = WATERWAY_COLOR; p['text-halo-color'] = LABEL_HALO; return;
      }

      if(sl === 'park'){
        if(layer.type === 'fill') p['fill-color'] = GREEN_FILL;
        if(layer.type === 'line') p['line-color'] = '#274436';
        return;
      }
      if(sl === 'landcover' || sl === 'landuse'){
        if(layer.type === 'fill') p['fill-color'] = GREEN_FILL_2;
        return;
      }
      if(sl === 'aeroway'){
        if(layer.type === 'fill') p['fill-color'] = '#232b26';
        if(layer.type === 'line') p['line-color'] = '#3a4a42';
        return;
      }
      if(sl === 'building'){
        if(p['fill-color'] !== undefined) p['fill-color'] = BUILDING_FILL;
        if(p['fill-extrusion-color'] !== undefined) p['fill-extrusion-color'] = BUILDING_FILL;
        if(p['fill-outline-color'] !== undefined) p['fill-outline-color'] = '#2a362f';
        return;
      }
      if(sl === 'boundary' && layer.type === 'line'){ p['line-color'] = BOUNDARY_COLOR; return; }

      if(sl === 'transportation'){
        if(layer.type === 'line'){
          var isRail = /rail/.test(layer.id);
          var isCasing = /casing/.test(layer.id);
          p['line-color'] = isRail ? RAIL_COLOR : (isCasing ? ROAD_CASING : ROAD_MAIN);
        }
        if(layer.type === 'fill'){ p['fill-opacity'] = 0.05; }
        return;
      }
      if(sl === 'transportation_name'){
        p['text-color'] = ROAD_LABEL_TEXT; p['text-halo-color'] = LABEL_HALO; p['text-halo-width'] = 1; return;
      }

      if(sl === 'poi' || sl === 'aerodrome_label'){
        p['text-color'] = '#cdd8d2'; p['text-halo-color'] = LABEL_HALO; return;
      }
      if(sl === 'place'){
        p['text-color'] = LABEL_TEXT; p['text-halo-color'] = LABEL_HALO; return;
      }
  }

  var statusEl = document.getElementById('statusText');
  function setStatus(t){ statusEl.textContent = t; }

  var errorBanner = document.getElementById('errorBanner');
  function showError(msg){
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
  }

  var map = null;
  var meMarker = null;
  var resultMarkers = [];
  var lastSpokenText = "";
  var currentPos = null;
  var MAX_ZOOM = 19;

  function fallbackStyle(){
    return {
      version: 8,
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
                  'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
                  'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap contributors'
        }
      },
      layers: [
        { id: 'bg', type: 'background', paint: { 'background-color': DARK_BG } },
        { id: 'osm-layer', type: 'raster', source: 'osm' }
      ]
    };
  }

  function startApp(){
    if(typeof maplibregl === 'undefined'){
      showError('Map library failed to load. Check your internet connection and reload the page.');
      return;
    }
    fetch('https://tiles.openfreemap.org/styles/liberty')
      .then(function(r){
        if(!r.ok) throw new Error('style fetch ' + r.status);
        return r.json();
      })
      .then(function(style){
        initMap(darkenStyle(style));
      })
      .catch(function(err){
        showError('Using basic map (style service unavailable): ' + err.message);
        initMap(fallbackStyle());
      });
  }
  window.__mlReady = startApp;

  function initMap(style){
    try{
      map = new maplibregl.Map({
        container: 'map',
        style: style,
        center: [78.9629, 20.5937],
        zoom: 4,
        attributionControl: true
      });
      map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
      map.on('load', function(){ locateMe(); });
      map.on('error', function(e){
        var m = (e && e.error && e.error.message) ? e.error.message : 'unknown map error';
        showError('Map error: ' + m);
      });
      wireUI();
    }catch(err){
      showError('Could not start the map: ' + err.message);
    }
  }

  if(typeof maplibregl !== 'undefined'){ startApp(); }
  // else: waits for window.__mlReady(), called by the jsdelivr fallback <script onload>,
  // or shows the "library failed to load" error if that also fails.
  window.setTimeout(function(){
    if(typeof maplibregl === 'undefined' && errorBanner.style.display === 'none'){
      showError('Map library failed to load. Check your internet connection and reload the page.');
    }
  }, 8000);

  function announce(text, interrupt){
    lastSpokenText = text;
    document.getElementById('liveRegion').textContent = text;
    if(!('speechSynthesis' in window)) return;
    if(interrupt !== false){ window.speechSynthesis.cancel(); }
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0;
    window.speechSynthesis.speak(u);
  }

  function clearResultMarkers(){
    resultMarkers.forEach(function(m){ m.remove(); });
    resultMarkers = [];
  }

  function reverseGeocodeAndSpeak(lat, lon){
    setStatus('Getting address…');
    fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lon + '&zoom=18&addressdetails=1')
      .then(function(r){ return r.json(); })
      .then(function(data){
        var addr = data.address || {};
        var city = addr.city || addr.town || addr.village || addr.suburb || addr.county || 'Unknown area';
        var full = data.display_name || (lat.toFixed(5) + ', ' + lon.toFixed(5));

        setStatus(city);
        announce('You are in ' + city + '.', true);
        window.setTimeout(function(){
          var u2 = new SpeechSynthesisUtterance('Exact location: ' + full);
          u2.rate = 1.0;
          window.speechSynthesis.speak(u2);
          lastSpokenText = 'You are in ' + city + '. Exact location: ' + full;
        }, 1800);
      })
      .catch(function(){
        setStatus('Address lookup failed');
        announce('Could not determine your address, but your position is on the map.');
      });
  }

  function locateMe(onFirstFix){
    if(!('geolocation' in navigator)){
      setStatus('Geolocation not supported');
      announce('This browser does not support location.');
      return;
    }
    setStatus('Locating…');
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      currentPos = {lat: lat, lon: lon};

      map.flyTo({ center: [lon, lat], zoom: MAX_ZOOM, speed: 1.6 });

      if(meMarker) meMarker.remove();
      var el = document.createElement('div');
      el.className = 'me-dot';
      meMarker = new maplibregl.Marker({ element: el })
        .setLngLat([lon, lat])
        .setPopup(new maplibregl.Popup().setText('You are here'))
        .addTo(map);

      reverseGeocodeAndSpeak(lat, lon);
      if(onFirstFix) onFirstFix();
    }, function(){
      setStatus('Location unavailable');
      announce('Could not get your location. Please check location permission.');
    }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 5000 });
  }

  // ---- Text search (Nominatim) ----
  function runTextSearch(query){
    if(!query) return;
    setStatus('Searching…');
    fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&q=' + encodeURIComponent(query) + '&addressdetails=1&namedetails=1&limit=10')
      .then(function(r){ return r.json(); })
      .then(function(list){
        var items = list.map(function(p){
          var shortName = (p.namedetails && p.namedetails.name) ? p.namedetails.name
            : (p.name && p.name.length ? p.name : p.display_name.split(',')[0].trim());
          return {
            name: shortName,
            full: p.display_name,
            lat: parseFloat(p.lat),
            lon: parseFloat(p.lon)
          };
        });
        showResults(items, 'results');
      })
      .catch(function(){ setStatus('Search failed'); announce('Search failed. Please try again.'); });
  }

  // ---- Nearby category search (Overpass, with mirror fallback) ----
  var OVERPASS_MIRRORS = [
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass-api.de/api/interpreter',
    'https://overpass.private.coffee/api/interpreter'
  ];

  function overpassFetch(query, mirrorIndex){
    mirrorIndex = mirrorIndex || 0;
    if(mirrorIndex >= OVERPASS_MIRRORS.length){
      return Promise.reject(new Error('all mirrors failed'));
    }
    var url = OVERPASS_MIRRORS[mirrorIndex] + '?data=' + encodeURIComponent(query);
    return fetch(url).then(function(r){
      if(!r.ok) throw new Error('bad status ' + r.status);
      return r.json();
    }).catch(function(){
      return overpassFetch(query, mirrorIndex + 1);
    });
  }

  var activeCat = null;
  function runNearbySearch(tag, label){
    if(!currentPos){
      announce('Getting your location first.');
      locateMe(function(){ runNearbySearch(tag, label); });
      return;
    }
    setStatus('Finding ' + label + '…');
    var kv = tag.split('=');
    var radius = 2000;
    var query = '[out:json][timeout:25];nwr["' + kv[0] + '"="' + kv[1] + '"](around:' + radius + ',' + currentPos.lat + ',' + currentPos.lon + ');out center 30;';
    overpassFetch(query)
      .then(function(data){
        var items = (data.elements || []).map(function(el){
          var name = (el.tags && el.tags.name) ? el.tags.name : label + ' (unnamed)';
          var lat = (el.type === 'node') ? el.lat : (el.center ? el.center.lat : null);
          var lon = (el.type === 'node') ? el.lon : (el.center ? el.center.lon : null);
          return { name: name, full: name, lat: lat, lon: lon };
        }).filter(function(it){ return it.lat != null && it.lon != null; });
        showResults(items, label);
      })
      .catch(function(){ setStatus('Nearby search failed'); announce('Could not fetch nearby places. Please check your internet connection and try again.'); });
  }

  function distMeters(lat1, lon1, lat2, lon2){
    var R = 6371000;
    var dLat = (lat2-lat1) * Math.PI/180;
    var dLon = (lon2-lon1) * Math.PI/180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function showResults(items, label){
    clearResultMarkers();
    var list = document.getElementById('resultsList');
    list.innerHTML = '';

    if(currentPos){
      items.forEach(function(it){ it.dist = distMeters(currentPos.lat, currentPos.lon, it.lat, it.lon); });
      items.sort(function(a,b){ return a.dist - b.dist; });
    }

    if(items.length === 0){
      setStatus('No results found');
      announce('No results found nearby.');
      closeResultsList();
      return;
    }

    var bounds = new maplibregl.LngLatBounds();
    if(meMarker) bounds.extend(meMarker.getLngLat());

    items.forEach(function(it){
      var marker = new maplibregl.Marker({ color: '#4aa3ff' })
        .setLngLat([it.lon, it.lat])
        .setPopup(new maplibregl.Popup().setText(it.name))
        .addTo(map);
      resultMarkers.push(marker);
      bounds.extend([it.lon, it.lat]);

      var li = document.createElement('li');
      var b = document.createElement('button');
      var distText = it.dist != null ? Math.round(it.dist) + ' meters away' : '';
      b.innerHTML = it.name + (distText ? '<span class="dist">' + distText + '</span>' : '');
      b.addEventListener('click', function(){
        map.flyTo({ center: [it.lon, it.lat], zoom: MAX_ZOOM });
        marker.togglePopup();
        announce(it.name + (distText ? ', ' + distText : ''));
      });
      li.appendChild(b);
      list.appendChild(li);
    });

    openResultsList();
    list.scrollTop = 0;
    map.fitBounds(bounds, { padding: 70, maxZoom: 17 });

    setStatus(items.length + ' results, nearest first');
    var msg = 'Found ' + items.length + ' ' + label + '. Nearest: ' + items[0].name +
      (items[0].dist != null ? ', ' + Math.round(items[0].dist) + ' meters away.' : '.');
    announce(msg);
  }

  function openResultsList(){ document.getElementById('resultsList').classList.add('open'); }
  function closeResultsList(){ document.getElementById('resultsList').classList.remove('open'); }

  function wireUI(){
    document.getElementById('myLocBtn').addEventListener('click', function(){ locateMe(); });
    document.getElementById('repeatBtn').addEventListener('click', function(){
      if(lastSpokenText) announce(lastSpokenText);
    });
    document.getElementById('stopBtn').addEventListener('click', function(){
      if('speechSynthesis' in window) window.speechSynthesis.cancel();
    });
    document.getElementById('searchBtn').addEventListener('click', function(){
      runTextSearch(document.getElementById('searchInput').value.trim());
    });
    document.getElementById('searchInput').addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ runTextSearch(this.value.trim()); }
    });
    document.querySelectorAll('.catBtn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var tag = btn.getAttribute('data-tag');
        document.querySelectorAll('.catBtn').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
        if(activeCat === tag){ activeCat = null; clearResultMarkers(); closeResultsList(); return; }
        activeCat = tag;
        btn.setAttribute('aria-pressed','true');
        runNearbySearch(tag, btn.textContent.trim());
      });
    });
  }
})();
</script>
</body>
</html>
